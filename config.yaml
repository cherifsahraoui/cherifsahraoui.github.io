module:
  imports:
    - path: github.com/CaiJimmy/hugo-theme-stack/v3

caches:
  images:
    dir: :cacheDir/images

baseurl: https://sahraoui-it.com
languageCode: en-us
theme: hugo-theme-stack
title: Sahraoui - Quality Engineering & DevOps Consulting
copyright: Cherif Sahraoui / Sahraoui - Consulting

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: en

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: false

languages:
    en:
        languageName: English
        title: Sahraoui - Quality Engineering & DevOps Consulting
        weight: 1
        params:
            reading_speed: 228
            sidebar:
                subtitle: A hands-on Quality Engineering, Test Automation, and DevOps consultant for cloud-native delivery, CI/CD quality, Kubernetes, and secure platforms.
            home:
                title: Quality Engineering & DevOps for Reliable Software Delivery
                subtitle: I help teams make quality an engineering capability by connecting test automation, CI/CD, GitOps, Kubernetes, and secure cloud platforms. Sahraoui - Consulting brings hands-on QA and DevOps expertise to faster, safer, and more reliable releases.
            about:
                title: Quality Engineering Meets DevOps
                subtitle: Building quality into platforms, pipelines, and releases
                whyQuality:
                    title: Why Quality Engineering and DevOps Belong Together
                    text1: Quality is not a final testing phase. In cloud-native delivery, it must be designed into architecture, code, CI/CD pipelines, infrastructure, and operational feedback loops.
                    text2: I work hands-on across test automation, API/UI testing, CI/CD, Kubernetes, Terraform, GitOps, and platform security to connect quality with reliable delivery.
                    text3: Sahraoui - Consulting helps teams establish pragmatic quality controls that improve release confidence, compliance, observability, and long-term maintainability.
                btnText: Explore My Quality Engineering Approach
            services:
                title: Services
                subtitle: Quality Engineering, Test Automation, and Cloud-Native Delivery Services
                qaStrategy:
                    title: Quality Engineering & Delivery Strategy
                    description: Defining testable delivery models, quality gates, risk-based test strategies, and scalable team practices.
                testAutomation:
                    title: Test Automation & Quality Platforms
                    description: Building maintainable API/UI automation and Kubernetes-native test execution into developer workflows.
                cicdIntegration:
                    title: CI/CD, GitOps & Release Engineering
                    description: Engineering secure, reliable pipelines with GitLab CI, Jenkins, ArgoCD, Helm, and cloud-native tooling.
                performanceSecurity:
                    title: DevSecOps, Reliability & Observability
                    description: Implementing secrets management, governance, compliance, monitoring, and reliable platform operations.
                qaLeadership:
                    title: Technical QA & Platform Leadership
                    description: Leading quality and platform initiatives through roadmap planning, testability, stakeholder alignment, and delivery ownership.
                testProcessOptimization:
                    title: Continuous Quality Improvement
                    description: Creating actionable metrics and feedback loops that improve test effectiveness, release flow, and production confidence.
            skills:
                title: Quality Engineering, DevOps & Platform Tooling
                subtitle: Technologies for automated quality and cloud-native delivery

                testingTools:
                    title: Quality Engineering & Test Automation
                    pytest: Pytest
                    selenium: Selenium
                    cypress: Cypress
                    junit: JUnit
                    postman: Postman
                    testkube: Testkube
                    apiUiTests: Automated API/UI Testing

                cloudDevOps:
                    title: DevOps, Cloud & Platform Engineering
                    kubernetes: Kubernetes (K8s)
                    docker: Docker
                    helm: Helm
                    argocd: ArgoCD
                    kustomize: Kustomize
                    terraform: Terraform
                    gitops: GitOps
                    harness: Harness
                    gitlabCi: GitLab CI
                    jenkins: Jenkins
                    bitbucketPipelines: Bitbucket Pipelines
                    aws: AWS
                    gcp: GCP
                    onPremK8s: On-Prem Kubernetes
                    iaac: Infrastructure-as-Code (IaC)
                    cicd: CI/CD Pipelines

                programming:
                    title: Programming & Scripting
                    python: Python
                    bash: Bash
                    linuxCommandLine: Linux Command Line

                monitoring:
                    title: Monitoring & Observability
                    prometheus: Prometheus
                    grafana: Grafana
                    sast: SAST (Static Application Security Testing)
                    dast: DAST (Dynamic Application Security Testing)

                versionControl:
                    title: Delivery, Quality & Collaboration Tools
                    bitbucket: Bitbucket
                    gitlab: GitLab
                    confluence: Confluence
                    jira: Jira
                    jiraXray: Jira/XRay
                    testrail: TestRail
                    vault: Vault
                    sonarqube: SonarQube

                security:
                    title: Security & DevSecOps
                    secretsManagement: Secrets Management (Vault, KMS)
                    imageSecurity: Container & OCI Image Security
                    supplyChain: Software Supply Chain Security (SLSA, SBOM)
                    signing: Artifact Signing (Cosign, Notation)
                    scanning: Dependency & Vulnerability Scanning (Trivy,)
                    policy: Policy-as-Code (OPA, Kyverno)
                    compliance: Compliance & Regulatory Controls (Energy, Banking)


            industries:
                title: Industries We Support
                subtitle: Engineering quality and reliable delivery in complex environments
                automotive:
                    title: Automotive
                    description: Automating quality and delivery pipelines for automotive platforms, embedded software, and connected systems.
                banking:
                    title: Banking & Finance
                    description: Test automation, compliant CI/CD, and infrastructure controls for regulated environments.
                energy:
                    title: Energy
                    description: Reliability-focused quality engineering, DevOps, and observability for critical energy and grid infrastructure.
            cta:
                title: Build Quality Into Every Release
                text1: Looking for hands-on Quality Engineering, test automation, DevOps, or CI/CD modernization support? Let's connect.
                text2: I help teams create secure, scalable delivery ecosystems where automated quality is part of the platform.
                btnText: Contact Me

